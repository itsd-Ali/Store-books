<div class="book-manager">
  <h1>إدارة الكتب</h1>

  <div class="form-section">
    <h2>إضافة كتاب جديد</h2>
    <form (ngSubmit)="addBook()" #bookForm="ngForm" class="book-form">
      <input type="text" placeholder="العنوان" [(ngModel)]="newBook.title" name="title" required />
      <input type="text" placeholder="المؤلف" [(ngModel)]="newBook.author" name="author" required />
      <input type="number" placeholder="السعر" [(ngModel)]="newBook.price" name="price" required />
      <input type="number" placeholder="التقييم (1-5)" [(ngModel)]="newBook.rating" name="rating" min="1" max="5" required />
      <input type="text" placeholder="التصنيف" [(ngModel)]="newBook.category" name="category" required />
      <textarea placeholder="نبذة" [(ngModel)]="newBook.summary" name="summary" required></textarea>
      <input type="text" placeholder="الرقم الدولي (ISBN)" [(ngModel)]="newBook.isbn" name="isbn" required />
      
      <div class="image-input">
        <input type="file" (change)="onImageSelected($event, 'add')" />
        <img *ngIf="newBook.imageUrl" [src]="newBook.imageUrl" class="preview" />

      </div>

      <button type="submit">إضافة</button>
    </form>
  </div>
  <div class="search-container">
  <input
    type="text"
    [(ngModel)]="searchQuery"
    (input)="filterBooks()"
    placeholder="ابحث عن كتاب بالعنوان أو المؤلف..."
  />
  </div>

  <div class="list-section">
    <h2>قائمة الكتب</h2>
    <div *ngIf="loading" class="loading">جار التحميل...</div>
    <div *ngIf="error" class="error">{{ error }}</div>

    <div class="book-list">
      <div *ngFor="let book of books" class="book-card">
        <img [src]="book.imageUrl" alt="صورة الكتاب" />
        <div class="book-details">
          <h3>{{ book.title }}</h3>
          <p><strong>المؤلف:</strong> {{ book.author }}</p>
          <p><strong>السعر:</strong> {{ book.price }} ريال</p>
          <p><strong>التصنيف:</strong> {{ book.category }}</p>
          <p><strong>التقييم:</strong> {{ book.rating }}</p>
          <p><strong>ISBN:</strong> {{ book.isbn }}</p>
          <p><strong>نبذة:</strong> {{ book.summary }}</p>
        </div>
        <div class="actions">
          <button (click)="editBook(book)">تعديل</button>
          <button (click)="deleteBook(book.id)">حذف</button>
        </div>
      </div>
    </div>
  </div>

  <div class="edit-section" *ngIf="editingBook">
    <h2>تعديل كتاب</h2>
    <form (ngSubmit)="saveEdit()" #editForm="ngForm" class="book-form">
      <input type="text" placeholder="العنوان" [(ngModel)]="editingBook.title" name="editTitle" required />
      <input type="text" placeholder="المؤلف" [(ngModel)]="editingBook.author" name="editAuthor" required />
      <input type="number" placeholder="السعر" [(ngModel)]="editingBook.price" name="editPrice" required />
      <input type="number" placeholder="التقييم" [(ngModel)]="editingBook.rating" name="editRating" min="1" max="5" required />
      <input type="text" placeholder="التصنيف" [(ngModel)]="editingBook.category" name="editCategory" required />
      <textarea placeholder="نبذة" [(ngModel)]="editingBook.summary" name="editSummary" required></textarea>
      <input type="text" placeholder="ISBN" [(ngModel)]="editingBook.isbn" name="editIsbn" required />
      <input type="text" placeholder="رابط الصورة" [(ngModel)]="editingBook.imageUrl" name="editImage" />

      <div class="form-buttons">
        <button type="submit">حفظ</button>
        <button type="button" (click)="cancelEdit()">إلغاء</button>
      </div>
    </form>
  </div>
  <!-- نافذة منبثقة للتعديل -->
<div class="modal-overlay" *ngIf="editingBook">
  <div class="modal-content">
    <h2>تعديل الكتاب</h2>
    <form (ngSubmit)="saveEdit()" class="modal-form">
      <input type="text" [(ngModel)]="editingBook.title" name="editTitle" placeholder="العنوان" required />
      <input type="text" [(ngModel)]="editingBook.author" name="editAuthor" placeholder="المؤلف" required />
      <input type="number" [(ngModel)]="editingBook.price" name="editPrice" placeholder="السعر" required />
      <input type="number" [(ngModel)]="editingBook.rating" name="editRating" min="1" max="5" placeholder="التقييم" required />
      <input type="text" [(ngModel)]="editingBook.category" name="editCategory" placeholder="التصنيف" required />
      <textarea [(ngModel)]="editingBook.summary" name="editSummary" placeholder="النبذة" required></textarea>
      <input type="text" [(ngModel)]="editingBook.isbn" name="editIsbn" placeholder="ISBN" required />
      <input type="file" (change)="onImageSelected($event, 'edit')" />
      <img *ngIf="editingBook?.imageUrl" [src]="editingBook.imageUrl" class="preview" />


      <div class="modal-buttons">
        <button type="submit">حفظ</button>
        <button type="button" class="cancel" (click)="cancelEdit()">إلغاء</button>
      </div>
    </form>
  </div>
</div>

</div>
