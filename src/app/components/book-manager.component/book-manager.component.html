<div class="book-manager">
  <h2>إدارة الكتب</h2>

  <input
    type="text"
    placeholder="ابحث عن كتاب"
    [(ngModel)]="searchQuery"
    (input)="filterBooks()"
    class="search-input"
  />

  <!-- زر فتح نافذة إضافة كتاب -->
  <button class="add-button" (click)="openAddModal()">إضافة كتاب جديد</button>

  <!-- قائمة الكتب -->
  <div class="book-list" *ngIf="!loading && books.length > 0">
    <div class="book-card" *ngFor="let book of books">
      <img [src]="book.imageUrl" alt="صورة الكتاب" width="80" height="100" />
      <div class="book-details">
        <h4>{{ book.title }}</h4>
        <p>المؤلف: {{ book.author }}</p>
        <p>السعر: {{ book.price }} د.ع</p>
        <p>التقييم: {{ book.rating }} / 5</p>
        <button (click)="editBook(book)">تعديل</button>
        <button (click)="deleteBook(book.id)">حذف</button>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && books.length === 0">
    <p>لا توجد كتب مطابقة.</p>
  </div>

  <div *ngIf="loading">
    <p>جاري التحميل...</p>
  </div>

  <!-- نافذة إضافة كتاب -->
  <app-add-book
    *ngIf="showAddModal"
    [book]="newBook"
    [imageNumber]="imageNumber"
    (save)="addBook()"
    (cancel)="closeAddModal()"
    (updateImage)="updateImageUrl($event)"
  ></app-add-book>

  <!-- نافذة تعديل كتاب -->
  <app-edit-book
    *ngIf="editingBook"
    [book]="editingBook"
    (save)="saveEdit()"
    (cancel)="cancelEdit()"
  ></app-edit-book>
</div>
